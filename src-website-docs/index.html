<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171719">
  <meta name="description" content="Developer documentation for the Roblox and Luau RAN Network Simulator.">
  <title>Overview · RAN Network Simulator Docs</title>
  <script>
    (() => {
      let savedTheme;
      try { savedTheme = localStorage.getItem('ran-docs-theme'); } catch (_) { /* Storage may be unavailable. */ }
      document.documentElement.dataset.theme = savedTheme === 'dark' || savedTheme === 'light'
        ? savedTheme
        : 'dark';
    })();
  </script>
  <link rel="stylesheet" href="./styles.css">
  <script src="./docs-data.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar" aria-label="Documentation navigation">
      <div class="sidebar-brand">
        <a class="brand-link" href="#/overview" aria-label="RAN Network Simulator documentation home">
          <span class="brand-copy"><strong>RAN Simulator</strong><small>Developer documentation</small></span>
        </a>
        <button class="icon-button sidebar-close" id="sidebarClose" type="button" aria-label="Close navigation">×</button>
      </div>
      <div class="sidebar-context"><span class="context-dot"></span> Roblox Studio <span class="context-sep">/</span> Luau</div>
      <nav class="sidebar-nav" id="sidebarNav" aria-label="Documentation topics"></nav>
    </aside>

    <div class="mobile-scrim" id="mobileScrim" hidden></div>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-start">
          <button class="icon-button menu-toggle" id="menuToggle" type="button" aria-label="Toggle documentation navigation" aria-controls="sidebar" aria-expanded="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <span class="topbar-divider"></span>
          <span class="topbar-location">Documentation <span>/</span> <strong id="topbarPage">Overview</strong></span>
        </div>
        <div class="topbar-actions">
          <button class="search-trigger" id="searchTrigger" type="button" aria-keyshortcuts="Control+k Meta+k /" aria-label="Search documentation">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
            <span>Search documentation</span><kbd>⌘ K</kbd>
          </button>
          <div class="theme-switch" role="group" aria-label="Color theme">
            <button class="theme-option" id="lightMode" type="button" aria-label="Light mode" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
              <span>Light</span>
            </button>
            <button class="theme-option" id="darkMode" type="button" aria-label="Dark mode" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.1 15.5A8.5 8.5 0 0 1 8.5 3.9 8.5 8.5 0 1 0 20.1 15.5Z"/></svg>
              <span>Dark</span>
            </button>
          </div>
        </div>
      </header>

      <div class="reading-layout">
        <main class="main-content" id="main-content" tabindex="-1">
          <div class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></div>
          <article class="doc-article" id="article"></article>
          <nav class="page-neighbors" id="pageNeighbors" aria-label="Adjacent pages"></nav>
          <footer class="content-footer">RAN Network Simulator · Developer documentation · Current implementation: Roblox Studio and Luau</footer>
        </main>
        <aside class="page-toc" id="pageToc" aria-label="On this page"></aside>
      </div>
    </div>
  </div>

  <dialog class="search-dialog" id="searchDialog" aria-label="Search documentation">
    <div class="search-box">
      <div class="search-input-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="searchInput" type="search" autocomplete="off" spellcheck="false" placeholder="Search topics, scripts, events…" aria-label="Search topics, scripts, and events">
        <button id="searchClose" type="button" aria-label="Close search">Esc</button>
      </div>
      <div class="search-results" id="searchResults" role="listbox" aria-label="Search results"></div>
      <div class="search-hint"><span><kbd>↑</kbd><kbd>↓</kbd> to navigate</span><span><kbd>Enter</kbd> to open</span><span><kbd>Esc</kbd> to close</span></div>
    </div>
  </dialog>
</body>
</html>
